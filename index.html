<style>
  :root { color-scheme: dark; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #05060a;
    color: #e9edf5;
    overflow: hidden;
  }
  html:not(.dark) body { background: #f4f6fb; color: #0c111d; }

  /* App-wide animated aurora background */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora::before, .aurora::after {
    content:''; position:absolute; width:60vw; height:60vw; border-radius:50%;
    filter: blur(120px); opacity:.35; animation: drift 22s ease-in-out infinite;
  }
  .aurora::before { background: radial-gradient(circle at 30% 30%, #00d188, transparent 60%); top:-15%; left:-10%; }
  .aurora::after  { background: radial-gradient(circle at 70% 70%, #4f7bff, transparent 60%); bottom:-20%; right:-10%; animation-delay:-8s; }
  html:not(.dark) .aurora::before { opacity:.22; }
  html:not(.dark) .aurora::after  { opacity:.22; }
  @keyframes drift { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(4%,6%) scale(1.12)} }

  .glass {
    background: rgba(20,24,34,.55);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,.08);
  }
  html:not(.dark) .glass {
    background: rgba(255,255,255,.7);
    border: 1px solid rgba(10,12,20,.08);
  }
  .glass-strong {
    background: rgba(14,17,25,.78);
    backdrop-filter: blur(26px) saturate(150%);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    border: 1px solid rgba(255,255,255,.09);
  }
  html:not(.dark) .glass-strong { background: rgba(255,255,255,.86); border:1px solid rgba(10,12,20,.07); }

  .card-lift { transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, border-color .35s; }
  .card-lift:hover { transform: translateY(-4px); box-shadow: 0 18px 50px -18px rgba(0,0,0,.6); border-color: rgba(0,209,136,.4); }

  /* Scrollbars */
  .scroll-area { scrollbar-width: thin; scrollbar-color: rgba(120,130,150,.4) transparent; }
  .scroll-area::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll-area::-webkit-scrollbar-thumb { background: rgba(120,130,150,.35); border-radius: 99px; }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: rgba(120,130,150,.6); }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }

  /* Live pulse dot */
  @keyframes livePulse { 0%,100%{opacity:.25; transform:scale(.85)} 50%{opacity:1; transform:scale(1.15)} }
  .live-dot { animation: livePulse 1.8s ease-in-out infinite; }
  @keyframes ringPulse { 0%{box-shadow:0 0 0 0 rgba(255,60,80,.55)} 100%{box-shadow:0 0 0 10px rgba(255,60,80,0)} }
  .live-ring { animation: ringPulse 1.6s ease-out infinite; }

  @keyframes fadeUp { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
  .fade-up { animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .fade-in { animation: fadeIn .4s ease both; }
  @keyframes popIn { from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)} }
  .pop-in { animation: popIn .35s cubic-bezier(.2,.9,.3,1.2) both; }

  /* Shimmer skeleton */
  .skeleton { position:relative; overflow:hidden; background: rgba(120,130,150,.14); }
  .skeleton::after { content:''; position:absolute; inset:0; transform:translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 100%{transform:translateX(100%)} }

  /* Animated stat bar fill */
  .bar-fill { transition: width 1.1s cubic-bezier(.2,.8,.2,1); }

  /* Bracket connectors */
  .bracket-track { background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 40px 40px; }
  html:not(.dark) .bracket-track { background-image: linear-gradient(rgba(10,12,20,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(10,12,20,.05) 1px, transparent 1px); }

  .grad-text { background: linear-gradient(92deg,#1fe89f,#4f7bff 60%,#a86bff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .no-scrollbar::-webkit-scrollbar{ display:none } .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none }
  [data-tip]{ position:relative }
  .tab-underline{ transition: all .3s cubic-bezier(.2,.8,.2,1); }
  .ring-anim { transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
  button, a { -webkit-tap-highlight-color: transparent; }

  /* ---- v4: ticker, animated gradient, shootout ---- */
  .grad-text-anim{ background:linear-gradient(92deg,#1fe89f,#4f7bff,#a86bff,#1fe89f); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation: shine 6s linear infinite; }
  @keyframes shine { to { background-position: 200% center; } }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { display:flex; flex-wrap:nowrap; width:max-content; align-items:center; animation: marquee 70s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .photo-glow{ box-shadow:0 0 0 3px rgba(255,255,255,.06), 0 14px 36px -10px rgba(0,0,0,.65); }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .floaty{ animation: floaty 5s ease-in-out infinite; }
  @keyframes penPop { 0%{transform:scale(0) rotate(-25deg);opacity:0} 70%{transform:scale(1.18)} 100%{transform:scale(1) rotate(0);opacity:1} }
  .pen-pop{ animation: penPop .5s cubic-bezier(.2,.9,.3,1.5) both; }
  @keyframes penGlow { 0%,100%{box-shadow:0 0 0 0 rgba(0,209,136,.55)} 50%{box-shadow:0 0 0 7px rgba(0,209,136,0)} }
  .pen-goal{ animation: penGlow 2.4s ease infinite; }
  @keyframes penMiss { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  .pen-miss{ animation: penMiss .4s ease 1; }
  @keyframes bannerIn { from{opacity:0; transform:translateY(8px) scale(.96)} to{opacity:1; transform:translateY(0) scale(1)} }
  .banner-in{ animation: bannerIn .6s cubic-bezier(.2,.8,.2,1) both; }
  img{ transition: opacity .4s ease; }
  /* bracket connectors */
  .bk-col:not(:last-of-type) .bk-node{ position:relative; }
  .bk-col:not(:last-of-type) .bk-node::after{ content:''; position:absolute; right:-32px; top:50%; transform:translateY(-50%); width:32px; height:2px; background:linear-gradient(90deg, rgba(0,209,136,.45), rgba(0,209,136,0)); }
  /* brand wordmark */
  .fs-wordmark{ font-family:'Outfit',sans-serif; font-weight:800; font-size:19px; letter-spacing:.01em; color:#3fc1f5; text-shadow:0 1px 0 rgba(0,0,0,.45),0 0 1px rgba(0,0,0,.55); }
  .fs-wordmark .fs-ital{ font-style:italic; font-weight:800; margin-left:1px; color:#56cbf7; }
</style>
